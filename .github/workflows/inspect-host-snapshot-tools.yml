name: Inspect signed host snapshot tooling
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Read installed Apple snapshot interfaces and entitlements
        run: |
          mkdir snapshot-tools
          bless --help > snapshot-tools/bless-help.txt 2>&1 || true
          diskutil apfs addVolume > snapshot-tools/add-volume-help.txt 2>&1 || true
          man diskutil | col -b > snapshot-tools/diskutil-man.txt || true
          /System/Library/Filesystems/apfs.fs/Contents/Resources/newfs_apfs -h > snapshot-tools/newfs-apfs-help.txt 2>&1 || true
          diskutil apfs > snapshot-tools/diskutil-apfs-help.txt 2>&1 || true
          asr help restore > snapshot-tools/asr-restore-help.txt 2>&1 || true
          asr restore --help > snapshot-tools/asr-options.txt 2>&1 || true
          man asr | col -b > snapshot-tools/asr-man.txt || true
          codesign -d --entitlements :- /usr/sbin/asr > snapshot-tools/asr-entitlements.txt 2>&1 || true
          /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs_checkseal -h > snapshot-tools/apfs-checkseal-help.txt 2>&1 || true
          /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -h > snapshot-tools/apfs-util-help.txt 2>&1 || true
          ls /System/Library/Filesystems/apfs.fs/Contents/Resources > snapshot-tools/apfs-resource-list.txt
          /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs_systemsnapshot -h > snapshot-tools/apfs-systemsnapshot-help.txt 2>&1 || true
          for tool in /usr/sbin/bless /usr/sbin/diskutil /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util; do
            codesign -d --entitlements :- "$tool" > "snapshot-tools/$(basename "$tool")-entitlements.txt" 2>&1 || true
          done
          codesign -d --entitlements :- /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs_systemsnapshot > snapshot-tools/apfs-systemsnapshot-entitlements.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: signed-host-snapshot-tools
          path: snapshot-tools
