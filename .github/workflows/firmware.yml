name: Inspect genuine iPod touch 7 firmware
on: [workflow_dispatch]
jobs:
  inspect:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s Tools -p 'test_*.py'
      - run: python3 Tools/fetch_firmware.py
      - run: python3 Tools/analyze_firmware.py
      - run: swift test
      - run: python3 Tools/verify_encodings.py
      - name: Probe actual kernel entry and report the first unsupported operation
        run: swift run podium7 --probe-kernel .firmware/KernelCache.macho > .firmware/kernel-entry-probe.json
      - name: Install external CPU and MMU backend for bootstrap research
        run: brew install qemu
      - name: Execute unpatched Apple kernel in bounded QEMU bootstrap harness
        run: python3 Tools/qemu_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-analysis
          path: |
            .firmware/analysis.json
            .firmware/firmware.json
            .firmware/kernel-entry-probe.json
            .firmware/qemu-probe.json
            .firmware/qemu-trace.txt
            .firmware/qemu-serial.txt
          include-hidden-files: true
