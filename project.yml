name: Podium7
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  Podium7Core:
    path: .
targets:
  Podium7:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: Podium7Core
        product: Podium7Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catyuragame.podium7
        MARKETING_VERSION: '0.0.1'
        CURRENT_PROJECT_VERSION: '1'
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: NO
