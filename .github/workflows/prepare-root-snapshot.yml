name: Prepare isolated official system root snapshot
on:
  workflow_dispatch:
    inputs:
      disk_run_id:
        description: Original official system disk preparation run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original root hash and build host snapshot API helper
        run: |
          python3 Tools/fetch_firmware.py --system-volume
          clang -Wall -Wextra -Werror Tools/create_apfs_snapshot.c -o .firmware/create-apfs-snapshot
      - uses: actions/download-artifact@v4
        with:
          name: ios-system-disk
          path: .firmware/system-disk
          run-id: ${{ inputs.disk_run_id }}
          github-token: ${{ github.token }}
      - name: Create actual named snapshot only on the isolated source-volume fixture
        run: python3 Tools/prepare_system_snapshot.py --disk .firmware/system-disk/storage-16g.raw --auth .firmware/SystemVolume.im4p --helper .firmware/create-apfs-snapshot --mount .firmware/snapshot-mount --output .firmware/root-snapshot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-snapshot-evidence
          path: .firmware/root-snapshot.json
      - uses: actions/upload-artifact@v4
        with:
          name: ios-system-disk
          path: .firmware/system-disk/storage-16g.raw
          retention-days: 3
          compression-level: 1
