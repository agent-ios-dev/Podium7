name: Probe original iOS from prepared APFS system disk
on:
  workflow_dispatch:
    inputs:
      sep_manager_probe:
        description: Explicit SEP transport experiment; disabled-aks uses original endpoint disable and research manager alias
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'disabled-aks'
          - 'disabled-aks-root-unsupported'
          - 'embedded-disabled-aks-root-unsupported'
          - 'embedded-tci-disabled-aks-root-unsupported'
      execution_seconds:
        description: Bounded real guest observation period
        type: choice
        default: '300'
        options:
          - '300'
          - '600'
      disk_run_id:
        description: Successful official system disk preparation run
        required: true
        type: string
      unsealed_diagnostic:
        description: Explicit unauthenticated system launchd diagnostic
        type: boolean
        default: false
      prepare_install_layout:
        description: Prepare real install volumes and validate guest APFS on isolated 16-GiB disk
        type: boolean
        default: false
      fastsim_diagnostic:
        description: Explicit no-SEP FastSim identity experiment requiring unsealed root
        type: boolean
        default: false
      no_sep_diagnostic:
        description: Omit unimplemented SEP only in explicit FastSim diagnostic
        type: boolean
        default: false
      keybag_diagnostics:
        description: Explicit product boot-ios-diagnostics handoff requiring no-SEP experiment
        type: boolean
        default: false
      debug_diagnostics:
        description: Explicit debug=0x14e profile for no-SEP keybag research
        type: boolean
        default: false
      root_device:
        description: Explicit research root-device name
        required: true
        default: disk0s1s1
        type: choice
        options:
          - disk0s1s1
          - disk0s1
permissions:
  contents: read
  actions: read
jobs:
  boot:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install distlib==0.3.9 capstone==5.0.9
      - run: python3 -m unittest discover -s Tools -p 'test_*.py'
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: qemu10-arm64-research-v1-${{ github.sha }}
          restore-keys: qemu10-arm64-research-v1-
      - run: python3 Tools/fetch_firmware.py --system-trust-cache --system-volume
      - run: python3 Tools/analyze_firmware.py
      - run: brew install glib pixman ninja pkgconf ccache
      - name: Build pinned verified research backend
        run: |
          git clone --depth 1 --branch v10.0.0 https://github.com/qemu/qemu.git .qemu
          python3 Tools/patch_qemu.py .qemu
          if [[ "${{ inputs.sep_manager_probe }}" == embedded-* ]]; then
            python3 Tools/patch_qemu_embedding.py .qemu
          fi
          mkdir .qemu/build
          cd .qemu/build
          mode=()
          if [[ "${{ inputs.sep_manager_probe }}" == "embedded-tci-disabled-aks-root-unsupported" ]]; then mode+=(--enable-tcg-interpreter); fi
          ../configure "${mode[@]}" --python="$(python -c 'import sys; print(sys.executable)')" --cc="ccache clang" --cxx="ccache clang++" --target-list=aarch64-softmmu --disable-docs --disable-tools --disable-guest-agent --disable-slirp --disable-hvf --disable-cocoa --disable-vnc --disable-sdl --disable-gtk --disable-curses
          ninja qemu-system-aarch64
          if [[ "${{ inputs.sep_manager_probe }}" == embedded-* ]]; then
            ninja libPodium7QEMU.dylib
          fi
      - name: Require real in-process execution before embedded system boot
        if: startsWith(inputs.sep_manager_probe, 'embedded-')
        run: |
          python3 Tools/check_embedded_guest.py --library .qemu/build/libPodium7QEMU.dylib --output .embedding-evidence
          cat > .qemu/build/qemu-library-host <<'SH'
          #!/bin/bash
          if [[ "${PODIUM7_TCI_BACKTRACE:-0}" == "1" && "${1:-}" != "--version" ]]; then
            exec xcrun lldb --batch -o 'settings set target.process.stop-on-exec false' -o run -o 'thread backtrace all -c 16' -o 'process kill' -- "$(command -v python3)" Tools/check_qemu_embedding.py --library .qemu/build/libPodium7QEMU.dylib -- "$@"
          fi
          exec python3 Tools/check_qemu_embedding.py --library .qemu/build/libPodium7QEMU.dylib -- "$@"
          SH
          chmod +x .qemu/build/qemu-library-host
      - name: Require guest PMGR state transitions before system boot
        run: python3 Tools/check_pmgr_power.py --qemu .qemu/build/qemu-system-aarch64
      - name: Require real scratch NVMe DMA and EL1 IRQ delivery before system boot
        run: python3 Tools/check_nvme.py --qemu .qemu/build/qemu-system-aarch64 --dart --msi
      - name: Wait for the specified official disk preparation to finish
        env:
          GH_TOKEN: ${{ github.token }}
          DISK_RUN: ${{ inputs.disk_run_id }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          run = os.environ['DISK_RUN']
          if not run.isdecimal():
              raise ValueError('disk run ID must be numeric')
          subprocess.run(['gh', 'run', 'watch', run, '--repo', os.environ['GITHUB_REPOSITORY'], '--interval', '30', '--exit-status'], check=True, timeout=2700)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ios-system-disk
          path: .firmware/system-disk
          run-id: ${{ inputs.disk_run_id }}
          github-token: ${{ github.token }}
      - name: Prepare missing install volumes only on isolated downloaded fixture
        if: inputs.prepare_install_layout
        run: python3 Tools/prepare_install_layout.py --disk .firmware/system-disk/storage-16g.raw --output .firmware/install-layout.json
      - name: Boot original kernel with official system trust cache and APFS disk
        env:
          RESEARCH_ROOT: ${{ inputs.root_device }}
          EXECUTION_SECONDS: ${{ inputs.execution_seconds }}
          KEYBAG_DIAGNOSTICS: ${{ inputs.keybag_diagnostics }}
          DEBUG_DIAGNOSTICS: ${{ inputs.debug_diagnostics }}
          NO_SEP_DIAGNOSTIC: ${{ inputs.no_sep_diagnostic }}
          SEP_MANAGER_PROBE: ${{ inputs.sep_manager_probe }}
          FASTSIM_DIAGNOSTIC: ${{ inputs.fastsim_diagnostic }}
          UNSEALED_DIAGNOSTIC: ${{ inputs.unsealed_diagnostic }}
        run: |
          mkdir .firmware/system-boot
          cp .firmware/KernelCache.macho .firmware/DeviceTree.bin .firmware/system-boot/
          python3 Tools/inspect_system_disk.py .firmware/system-disk/storage-16g.raw --output .firmware/system-boot/system-disk-layout.json
          extra=()
          case "$EXECUTION_SECONDS" in 300|600) ;; *) echo 'Invalid guest execution budget'; exit 1;; esac
          if [[ "$UNSEALED_DIAGNOSTIC" == "true" ]]; then extra+=(--research-unsealed-root); fi
          if [[ "$FASTSIM_DIAGNOSTIC" == "true" ]]; then extra+=(--research-fastsim); fi
          if [[ "$NO_SEP_DIAGNOSTIC" == "true" ]]; then extra+=(--research-no-sep); fi
          if [[ "$SEP_MANAGER_PROBE" == "true" ]]; then extra+=(--research-sep-manager-probe); fi
          if [[ "$SEP_MANAGER_PROBE" == "disabled-aks" ]]; then extra+=(--research-sep-manager-probe --research-disabled-aks); fi
          if [[ "$SEP_MANAGER_PROBE" == "disabled-aks-root-unsupported" ]]; then extra+=(--research-sep-manager-probe --research-disabled-aks --research-platform-root-unsupported); fi
          qemu=.qemu/build/qemu-system-aarch64
            if [[ "$SEP_MANAGER_PROBE" == embedded-* ]]; then
            extra+=(--research-sep-manager-probe --research-disabled-aks --research-platform-root-unsupported)
              qemu=.qemu/build/qemu-library-host
            fi
            # Obtain real native frames for the observed TCI SIGSEGV. No memory
            # dumps, register dumps, guest key values or artificial boot claims.
            if [[ "$SEP_MANAGER_PROBE" == "embedded-tci-disabled-aks-root-unsupported" ]]; then export PODIUM7_TCI_BACKTRACE=1; fi
          if [[ "$KEYBAG_DIAGNOSTICS" == "true" ]]; then extra+=(--research-keybag-diagnostics); fi
          if [[ "$DEBUG_DIAGNOSTICS" == "true" ]]; then extra+=(--research-debug-diagnostics); fi
          python3 Tools/qemu_probe.py "${extra[@]}" --qemu "$qemu" --cpu podium7-research --directory .firmware/system-boot --research-bridge-handoff --trust-cache .firmware/StaticTrustCache.im4p --system-volume .firmware/SystemVolume.im4p --research-system-root "$RESEARCH_ROOT" --research-pmp-core --research-cfi-nvram --research-aes-root-fallback --research-nvme --research-nvme-dart --research-nvme-msi --research-nvme-image .firmware/system-disk/storage-16g.raw --seconds "$EXECUTION_SECONDS" --trace-limit-mib 256
          python3 Tools/inspect_boot_fault.py --directory .firmware/system-boot
          python3 Tools/inspect_system_disk.py .firmware/system-disk/storage-16g.raw --trace .firmware/system-boot/qemu-trace.txt --output .firmware/system-boot/system-disk-layout.json
          python3 Tools/verify_system_userland.py .firmware/system-boot
      - name: Save all full-system boot diagnostics regardless of boot outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-boot-evidence
          path: |
            .firmware/system-boot/*.json
            .firmware/system-boot/*.txt
            .firmware/nvme-checks.json
            .firmware/pmgr-power-checks.json
            .firmware/install-layout.json
            .embedding-evidence/*.json
          if-no-files-found: ignore
