name: Probe Apple bootstrap with explicit research register model
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Tools/**'
      - '.github/workflows/apple-bootstrap.yml'
jobs:
  bootstrap:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install distlib==0.3.9 capstone==5.0.9
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: qemu10-arm64-research-v1-${{ github.sha }}
          restore-keys: qemu10-arm64-research-v1-
      - run: python3 -m unittest discover -s Tools -p 'test_*.py'
      - run: python3 Tools/fetch_firmware.py --restore-ramdisk
      - run: python3 Tools/analyze_firmware.py
      - name: Audit PMGR bootloader bridge settings
        run: python3 Tools/inspect_pmgr_handoff.py
      - name: Install build dependencies
        run: brew install glib pixman ninja pkgconf ccache
      - name: Prepare pinned QEMU with opt-in APRR register latches
        run: |
          git clone --depth 1 --branch v10.0.0 https://github.com/qemu/qemu.git .qemu
          python3 Tools/patch_qemu.py .qemu
      - name: Build external research CPU backend
        run: |
          mkdir .qemu/build
          cd .qemu/build
          ../configure --python="$(python -c 'import sys; print(sys.executable)')" --cc="ccache clang" --cxx="ccache clang++" --target-list=aarch64-softmmu --disable-docs --disable-tools --disable-guest-agent --disable-slirp --disable-hvf --disable-cocoa --disable-vnc --disable-sdl --disable-gtk --disable-curses
          ninja qemu-system-aarch64
      - name: Verify genuine physical and virtual timer FIQ delivery
        run: python3 Tools/check_timer_fiq.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify T8010 AIC v1 MMIO model
        run: python3 Tools/check_aic.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify Apple watchdog MMIO model
        run: python3 Tools/check_wdt.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify T8010 GPIO MMIO model
        run: python3 Tools/check_gpio.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify T8010 AES register windows
        run: python3 Tools/check_aes.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify T8010 SoCHot and temperature sensor register windows
        run: python3 Tools/check_sochot.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify T8010 OTG PHY register windows
        run: python3 Tools/check_usbphy.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify original DWI initialization control range
        run: python3 Tools/check_dwi.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify original MCA banks and reset registers
        run: python3 Tools/check_mca.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify original MIPI-DSIM register window
        run: python3 Tools/check_mipi_dsim.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify shared SGX and GFX control windows
        run: python3 Tools/check_gfx.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify original ARM error-handler register ranges
        run: python3 Tools/check_error_handler.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify original SEP, SIO and PMP mailbox controls and queues
        run: python3 Tools/check_sep_mailbox.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify original SPI1 and SPI2 control banks
        run: python3 Tools/check_spi.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify original I2C timing and control banks
        run: python3 Tools/check_i2c.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify real AIC and I2C interrupt delivery to EL1
        run: python3 Tools/check_aic_irq.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify original DART discovery and stream controls
        run: python3 Tools/check_dart.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify original PCIe controls and empty configuration space
        run: python3 Tools/check_pcie.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify free-running AOP counter and firmware apertures
        run: python3 Tools/check_aop.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify original CPU debug and CLPC control banks
        run: python3 Tools/check_cpu_clpc.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify T8010 AOP I2S routing register
        run: python3 Tools/check_i2s_switch.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify all PMGR bridge register windows with original DeviceTree
        run: python3 Tools/check_pmgr_bridges.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify PMGR desired and actual power-state fields
        run: python3 Tools/check_pmgr_power.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify synthetic CFI NVRAM query and persistent programming
        run: python3 Tools/check_cfi_nvram.py --qemu .qemu/build/qemu-system-aarch64
      - name: Probe actual embedded PMP firmware on an ARMv7 core
        run: python3 Tools/probe_pmp_core.py --qemu .qemu/build/qemu-system-aarch64
      - name: Execute original kernel and retain the next failure
        run: python3 Tools/qemu_probe.py --qemu .qemu/build/qemu-system-aarch64 --cpu podium7-research
      - name: Probe synthetic bridge handoff separately from original metadata
        run: |
          mkdir .firmware/bridge-experiment
          cp .firmware/KernelCache.macho .firmware/DeviceTree.bin .firmware/bridge-experiment/
          python3 Tools/qemu_probe.py --qemu .qemu/build/qemu-system-aarch64 --cpu podium7-research --directory .firmware/bridge-experiment --research-bridge-handoff
          python3 Tools/inspect_boot_fault.py --directory .firmware/bridge-experiment
      - name: Probe genuine restore ramdisk root device separately
        run: |
          mkdir .firmware/ramdisk-experiment
          cp .firmware/KernelCache.macho .firmware/DeviceTree.bin .firmware/ramdisk-experiment/
          python3 Tools/ramdisk_handoff.py .firmware/RestoreRamDisk.im4p .firmware/RestoreRamDisk.payload
          python3 Tools/qemu_probe.py --qemu .qemu/build/qemu-system-aarch64 --cpu podium7-research --directory .firmware/ramdisk-experiment --research-bridge-handoff --ramdisk .firmware/RestoreRamDisk.payload --trust-cache .firmware/RestoreTrustCache.im4p --seconds 30
          python3 Tools/inspect_boot_fault.py --directory .firmware/ramdisk-experiment
      - name: Isolate restore userland from blocked root security callback
        run: |
          mkdir .firmware/restore-userland-experiment
          cp .firmware/KernelCache.macho .firmware/DeviceTree.bin .firmware/restore-userland-experiment/
          python3 Tools/qemu_probe.py --qemu .qemu/build/qemu-system-aarch64 --cpu podium7-research --directory .firmware/restore-userland-experiment --research-bridge-handoff --ramdisk .firmware/RestoreRamDisk.payload --trust-cache .firmware/RestoreTrustCache.im4p --research-ramdisk-root --seconds 120
          python3 Tools/inspect_boot_fault.py --directory .firmware/restore-userland-experiment
      - name: Require actual restore launchd and EL0 execution
        run: python3 Tools/verify_restore_userland.py .firmware/restore-userland-experiment
      - name: Probe original CHRP driver with synthetic NOR separately
        run: |
          mkdir .firmware/cfi-nvram-experiment
          cp .firmware/KernelCache.macho .firmware/DeviceTree.bin .firmware/cfi-nvram-experiment/
          python3 Tools/qemu_probe.py --qemu .qemu/build/qemu-system-aarch64 --cpu podium7-research --directory .firmware/cfi-nvram-experiment --research-bridge-handoff --ramdisk .firmware/RestoreRamDisk.payload --trust-cache .firmware/RestoreTrustCache.im4p --research-ramdisk-root --research-cfi-nvram --seconds 120
          python3 Tools/inspect_boot_fault.py --directory .firmware/cfi-nvram-experiment
      - name: Verify NVRAM survives a second actual kernel start
        run: |
          mkdir .firmware/cfi-first-boot
          cp .firmware/cfi-nvram-experiment/*.json .firmware/cfi-nvram-experiment/*.txt .firmware/cfi-first-boot/
          python3 Tools/qemu_probe.py --qemu .qemu/build/qemu-system-aarch64 --cpu podium7-research --directory .firmware/cfi-nvram-experiment --research-bridge-handoff --ramdisk .firmware/RestoreRamDisk.payload --trust-cache .firmware/RestoreTrustCache.im4p --research-ramdisk-root --research-cfi-nvram --seconds 120
          python3 -c 'import json; from pathlib import Path; p=Path(".firmware/cfi-nvram-experiment"); h=json.loads((p/"nvram-handoff.json").read_text()); j=json.loads((p/"qemu-probe.json").read_text()); assert h["selected_generation"] > 1; assert j["boot_milestones"]["userland_execution_confirmed"]; assert any(b["adler_valid"] and b["restore_outcome_variable_present"] for b in j["nvram_backing_evidence"]["banks"])'
      - name: Verify MCC register lock and protected RAM
        timeout-minutes: 1
        run: python3 Tools/check_mcc.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify KTRR lock and EL1 instruction permission faults
        timeout-minutes: 1
        run: python3 Tools/check_ktrr.py --qemu .qemu/build/qemu-system-aarch64
      - name: Verify APRR latches using a real assembler-built guest
        run: python3 Tools/check_qemu_registers.py --qemu .qemu/build/qemu-system-aarch64
      - name: Disassemble the genuine XNU panic and first exception
        if: always()
        run: python3 Tools/inspect_boot_fault.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-bootstrap-evidence
          include-hidden-files: true
          path: |
            .firmware/cfi-first-boot/*.json
            .firmware/cfi-first-boot/*.txt
            .firmware/cfi-nvram-checks.json
            .firmware/cfi-nvram-experiment/*.json
            .firmware/cfi-nvram-experiment/*.txt
            .firmware/restore-userland-experiment/*.json
            .firmware/restore-userland-experiment/*.txt
            .firmware/ramdisk-experiment/*.json
            .firmware/ramdisk-experiment/*.txt
            .firmware/bridge-experiment/*.json
            .firmware/bridge-experiment/*.txt
            .firmware/guest-patches.json
            .firmware/firmware.json
            .firmware/analysis.json
            .firmware/DeviceTree.bin
            .firmware/pmgr-handoff.json
            .firmware/pmgr-bridge-checks.json
            .firmware/pmgr-power-checks.json
            .firmware/cpu-snapshot.json
            .firmware/cpu-snapshot.txt
            .firmware/cpu-stack.txt
            .firmware/qemu-probe.json
            .firmware/qemu-trace.txt
            .firmware/qemu-serial.txt
            .firmware/qemu-register-checks.json
            .firmware/first-fault-disassembly.txt
            .firmware/first-fault-strings.txt
            .firmware/panic-context.json
            .firmware/panic-disassembly.txt
            .firmware/last-block-disassembly.txt
            .firmware/device-tree-preparation.json
            .firmware/register-check-trace.txt
            .firmware/mcc-checks.json
            .firmware/timer-fiq-checks.json
            .firmware/aic-checks.json
            .firmware/aic-irq-checks.json
            .firmware/wdt-checks.json
            .firmware/gpio-checks.json
            .firmware/aes-checks.json
            .firmware/thermal-sensor-checks.json
            .firmware/usbphy-checks.json
            .firmware/dwi-checks.json
            .firmware/mca-checks.json
            .firmware/mipi-dsim-checks.json
            .firmware/gfx-checks.json
            .firmware/error-handler-checks.json
            .firmware/sep-mailbox-checks.json
            .firmware/spi-checks.json
            .firmware/i2c-checks.json
            .firmware/dart-checks.json
            .firmware/pcie-checks.json
            .firmware/aop-checks.json
            .firmware/pmp-core-experiment/qemu-probe.json
            .firmware/pmp-core-experiment/qemu-trace.txt
            .firmware/cpu-clpc-checks.json
            .firmware/i2s-switch-checks.json
            .firmware/ktrr-checks.json
            .firmware/ktrr-check-trace.txt
