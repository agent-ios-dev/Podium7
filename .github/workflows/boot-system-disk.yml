name: Probe original iOS from prepared APFS system disk
on:
  workflow_dispatch:
    inputs:
      disk_run_id:
        description: Successful official system disk preparation run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  boot:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install distlib==0.3.9 capstone==5.0.9
      - run: python3 -m unittest discover -s Tools -p 'test_*.py'
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: qemu10-arm64-research-v1-${{ github.sha }}
          restore-keys: qemu10-arm64-research-v1-
      - run: python3 Tools/fetch_firmware.py --system-trust-cache
      - run: python3 Tools/analyze_firmware.py
      - run: brew install glib pixman ninja pkgconf ccache
      - name: Build pinned verified research backend
        run: |
          git clone --depth 1 --branch v10.0.0 https://github.com/qemu/qemu.git .qemu
          python3 Tools/patch_qemu.py .qemu
          mkdir .qemu/build
          cd .qemu/build
          ../configure --python="$(python -c 'import sys; print(sys.executable)')" --cc="ccache clang" --cxx="ccache clang++" --target-list=aarch64-softmmu --disable-docs --disable-tools --disable-guest-agent --disable-slirp --disable-hvf --disable-cocoa --disable-vnc --disable-sdl --disable-gtk --disable-curses
          ninja qemu-system-aarch64
      - name: Require real scratch NVMe DMA and EL1 IRQ delivery before system boot
        run: python3 Tools/check_nvme.py --qemu .qemu/build/qemu-system-aarch64 --dart --msi
      - name: Wait for the specified official disk preparation to finish
        env:
          GH_TOKEN: ${{ github.token }}
          DISK_RUN: ${{ inputs.disk_run_id }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          run = os.environ['DISK_RUN']
          if not run.isdecimal():
              raise ValueError('disk run ID must be numeric')
          subprocess.run(['gh', 'run', 'watch', run, '--repo', os.environ['GITHUB_REPOSITORY'], '--interval', '30', '--exit-status'], check=True, timeout=2700)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ios-system-disk
          path: .firmware/system-disk
          run-id: ${{ inputs.disk_run_id }}
          github-token: ${{ github.token }}
      - name: Boot original kernel with official system trust cache and APFS disk
        run: |
          mkdir .firmware/system-boot
          cp .firmware/KernelCache.macho .firmware/DeviceTree.bin .firmware/system-boot/
          python3 Tools/qemu_probe.py --qemu .qemu/build/qemu-system-aarch64 --cpu podium7-research --directory .firmware/system-boot --research-bridge-handoff --trust-cache .firmware/StaticTrustCache.im4p --research-system-root disk0s1s1 --research-pmp-core --research-cfi-nvram --research-aes-root-fallback --research-nvme --research-nvme-dart --research-nvme-msi --research-nvme-image .firmware/system-disk/storage-16g.raw --seconds 300
          python3 Tools/inspect_boot_fault.py --directory .firmware/system-boot
      - name: Save all full-system boot diagnostics regardless of boot outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-boot-evidence
          path: |
            .firmware/system-boot/*.json
            .firmware/system-boot/*.txt
            .firmware/nvme-checks.json
          if-no-files-found: ignore
