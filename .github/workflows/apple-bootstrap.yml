name: Probe Apple bootstrap with explicit research register model
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Tools/**'
      - '.github/workflows/apple-bootstrap.yml'
jobs:
  bootstrap:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install distlib==0.3.9
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: qemu10-arm64-research-v1-${{ github.sha }}
          restore-keys: qemu10-arm64-research-v1-
      - run: python3 -m unittest discover -s Tools -p 'test_*.py'
      - run: python3 Tools/fetch_firmware.py
      - run: python3 Tools/analyze_firmware.py
      - name: Install build dependencies
        run: brew install glib pixman ninja pkgconf ccache
      - name: Prepare pinned QEMU with opt-in APRR register latches
        run: |
          git clone --depth 1 --branch v10.0.0 https://github.com/qemu/qemu.git .qemu
          python3 Tools/patch_qemu.py .qemu
      - name: Build external research CPU backend
        run: |
          mkdir .qemu/build
          cd .qemu/build
          ../configure --python="$(python -c 'import sys; print(sys.executable)')" --cc="ccache clang" --cxx="ccache clang++" --target-list=aarch64-softmmu --disable-docs --disable-tools --disable-guest-agent --disable-slirp --disable-hvf --disable-cocoa --disable-vnc --disable-sdl --disable-gtk --disable-curses
          ninja qemu-system-aarch64
      - name: Execute original kernel and retain the next failure
        run: python3 Tools/qemu_probe.py --qemu .qemu/build/qemu-system-aarch64 --cpu podium7-research
      - name: Verify APRR latches using a real assembler-built guest
        run: python3 Tools/check_qemu_registers.py --qemu .qemu/build/qemu-system-aarch64
      - name: Disassemble the first genuine kernel fault
        if: always()
        run: python3 Tools/inspect_boot_fault.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-bootstrap-evidence
          include-hidden-files: true
          path: |
            .firmware/firmware.json
            .firmware/analysis.json
            .firmware/qemu-probe.json
            .firmware/qemu-trace.txt
            .firmware/qemu-serial.txt
            .firmware/qemu-register-checks.json
            .firmware/first-fault-disassembly.txt
            .firmware/first-fault-strings.txt
            .firmware/device-tree-preparation.json
            .firmware/register-check-trace.txt
