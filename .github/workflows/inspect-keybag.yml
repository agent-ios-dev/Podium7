name: Inspect original keybag wait conditions read-only
on:
  workflow_dispatch:
    inputs:
      disk_run_id:
        description: Official System disk preparation run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.9
      - run: python -m unittest discover -s Tools -p 'test_keybag_inspection.py'
      - uses: actions/download-artifact@v4
        with:
          name: ios-system-disk
          path: .firmware/system-disk
          run-id: ${{ inputs.disk_run_id }}
          github-token: ${{ github.token }}
      - name: Inspect selected original files without exporting binaries or changing the disk
        run: python Tools/inspect_keybag_host.py --disk .firmware/system-disk/storage-16g.raw --output .firmware/keybag-inspection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keybag-inspection
          path: .firmware/keybag-inspection.json
          if-no-files-found: ignore
